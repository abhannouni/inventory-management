<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4A0F3A"/>
      <stop offset="1" stop-color="#25001B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#17000F" flood-opacity="0.4"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="96" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="93" fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="1.5"/>
  <ellipse cx="68" cy="52" rx="36" ry="22" fill="rgba(255,255,255,0.07)" transform="rotate(-28 68 52)"/>

  <text x="100" y="132" text-anchor="middle" font-family="Manrope, Georgia, serif" font-weight="800" font-size="96" fill="#EDE7DC">B</text>
</svg>
