<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#37C895"/>
      <stop offset="1" stop-color="#174F40"/>
    </linearGradient>
    <linearGradient id="accent" x1="84" y1="56" x2="116" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#AAFAD4"/>
      <stop offset="1" stop-color="#2FA084"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0D3A2C" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Main circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Subtle inner bevel ring -->
  <circle cx="100" cy="100" r="93" fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="1.5"/>

  <!-- Top-left gloss blob -->
  <ellipse cx="68" cy="52" rx="36" ry="22" fill="rgba(255,255,255,0.07)" transform="rotate(-28 68 52)"/>

  <!-- Location pin — head center (100, 72) radius 28, tip at y=148 -->
  <path d="M 72,72 A 28,28 0 1 0 128,72 L 100,148 Z"
        fill="rgba(255,255,255,0.1)"
        stroke="rgba(255,255,255,0.9)"
        stroke-width="5"
        stroke-linejoin="round"/>

  <!-- Accent circle inside pin head -->
  <circle cx="100" cy="72" r="17" fill="url(#accent)"/>

  <!-- Gloss on accent circle -->
  <ellipse cx="92" cy="64" rx="6" ry="4" fill="rgba(255,255,255,0.28)" transform="rotate(-20 92 64)"/>

  <!-- Checkmark inside / bursting from accent circle -->
  <path d="M 87,72 L 96,82 L 115,58"
        stroke="white"
        stroke-width="6.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
